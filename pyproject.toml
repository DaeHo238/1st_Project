[project]
name = "project1"
version = "0.1.0"
description = "BRFSS 2015 당뇨병 건강지표 데이터로 의료 접근성이 건강 결과에 미치는 영향을 분석하는 프로젝트"
readme = "README.md"
authors = [
    { name = "Daeho Lee", email = "dleogh2006@naver.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
]
